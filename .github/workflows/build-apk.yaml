name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Ensure web directory exists
        run: |
          if [ ! -d "www" ]; then
            if [ -d "dist" ]; then
              cp -r dist www
            else
              mkdir -p www
              cp index.html www/ 2>/dev/null || true
              cp -r js css assets www/ 2>/dev/null || true
            fi
          fi

      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Milk-Tracker-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk